name: Publish (Nightly)

on:
  push:
    branches: ['main']
    paths:
      - '**'
      - '!**.md'
      - '!**/*.md'
      - '!**/.gitignore'
      - '!.gitignore'
      - '!.github/**'
      - '.github/workflows/publish-nightly.yml'
      - '!docs/**'
      - '!LICENSE'
      - '!LICENSE.*'
      - '!LICENCE'
      - '!LICENCE.*'
      - '!COPYING'
      - '!COPYING.*'
      - '!NOTICE'
      - '!NOTICE.*'
      - '!PATENTS'
      - '!PATENTS.*'

# Required vars: SIGNING_API_ISSUER_ID, SIGNING_API_KEY_ID, ASC_UPLOAD_API_ISSUER_ID,
# ASC_UPLOAD_API_KEY_ID, APPSTORE_USES_NON_EXEMPT_ENCRYPTION. Required secrets:
# APPSTORE_CERTIFICATES_FILE_BASE64, APPSTORE_CERTIFICATES_PASSWORD, SIGNING_API_PRIVATE_KEY,
# ASC_UPLOAD_API_PRIVATE_KEY, TESTFLIGHT_INTERNAL_GROUP_ID (intentionally a repository secret).
# Protect the code-signing and app-store-connect environments.
# This protects only this repository's read-max-plus-one allocation; GitHub retains one pending run.
# Manual/external uploads and superseded pending pushes are outside this guarantee.
permissions:
  contents: read

concurrency:
  group: app-store-connect-build-number
  cancel-in-progress: false

jobs:
  allocate-build-number:
    name: Allocate App Store Connect build number
    runs-on: macos-latest
    environment: app-store-connect
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ios_build_number: ${{ steps.allocate.outputs.ios_build_number }}
      macos_build_number: ${{ steps.allocate.outputs.macos_build_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Prepare App Store Connect private key
        id: prepare-key
        shell: bash
        env:
          ASC_UPLOAD_API_PRIVATE_KEY: ${{ secrets.ASC_UPLOAD_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AppStoreConnectKey.p8"
          umask 077
          printf '%s' "$ASC_UPLOAD_API_PRIVATE_KEY" > "$key_path"
          [[ -s "$key_path" ]] || {
            printf '%s\n' 'ASC_UPLOAD_API_PRIVATE_KEY is empty.' >&2
            exit 1
          }
          printf 'key-path=%s\n' "$key_path" >> "$GITHUB_OUTPUT"

      - name: Allocate next platform build numbers
        id: allocate
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ vars.ASC_UPLOAD_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_UPLOAD_API_KEY_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.prepare-key.outputs.key-path }}
          BUNDLE_ID: com.swihomo.client
        run: python3 scripts/manage_testflight_builds.py next-build-numbers

      - name: Remove App Store Connect private key
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/AppStoreConnectKey.p8"

  cleanup-artifact:
    name: Delete signed packages artifact
    if: ${{ always() }}
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete signed packages
        uses: geekyeggo/delete-artifact@2b29beac362fd85f267740d1cf3dd53861de3568 # v6.0.0
        with:
          name: signed-packages
          useGlob: false
          failOnError: false

  build:
    name: Build signed packages
    needs: allocate-build-number
    runs-on: macos-latest
    environment: code-signing
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      marketing-version: ${{ steps.version.outputs.marketing-version }}
      ios-build-number: ${{ needs.allocate-build-number.outputs.ios_build_number }}
      macos-build-number: ${{ needs.allocate-build-number.outputs.macos_build_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Record Xcode version
        id: xcode_version
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | tr -cs '[:alnum:]._-' '-')"
          [[ -n "$xcode_version" ]] || {
            printf '%s\n' 'xcodebuild -version returned an empty value.' >&2
            exit 1
          }
          printf 'version=%s\n' "$xcode_version" >> "$GITHUB_OUTPUT"

      - name: Prepare mihomo submodule
        shell: bash
        run: bash scripts/prepare-mihomo-core.sh --submodule-only

      - name: Calculate MihomoCore cache key
        id: mihomo_cache_key
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git -C Vendor/mihomo rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'MihomoCore cache key requires a lowercase 40-character submodule SHA, found: %s\n' "$commit" >&2
            exit 1
          }
          printf 'key=mihomo-core-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode_version.outputs.version }}-%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Restore MihomoCore cache
        id: mihomo_core_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.mihomo_cache_key.outputs.key }}
          path: |
            Vendor/MihomoCore.xcframework
            Swihomo/Shared/MihomoCoreVersion.swift

      - name: Build MihomoCore
        if: steps.mihomo_core_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/prepare-mihomo-core.sh

      - name: Verify MihomoCore cache output
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f Vendor/MihomoCore.xcframework/Info.plist ]] || {
            printf '%s\n' 'MihomoCore cache/build output is missing Vendor/MihomoCore.xcframework/Info.plist.' >&2
            exit 1
          }
          [[ -f Swihomo/Shared/MihomoCoreVersion.swift ]] || {
            printf '%s\n' 'MihomoCore cache/build output is missing Swihomo/Shared/MihomoCoreVersion.swift.' >&2
            exit 1
          }

      - name: Save MihomoCore cache
        if: steps.mihomo_core_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.mihomo_cache_key.outputs.key }}
          path: |
            Vendor/MihomoCore.xcframework
            Swihomo/Shared/MihomoCoreVersion.swift

      - name: Import signing certificates
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          keychain: ${{ runner.temp }}/swihomo-signing
          create-keychain: true

      - name: Install iOS app provisioning profile
        id: ios_app_profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.swihomo.client
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.SIGNING_API_ISSUER_ID }}
          api-key-id: ${{ vars.SIGNING_API_KEY_ID }}
          api-private-key: ${{ secrets.SIGNING_API_PRIVATE_KEY }}

      - name: Install iOS PacketTunnel provisioning profile
        id: ios_packet_tunnel_profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.swihomo.client.PacketTunnel
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.SIGNING_API_ISSUER_ID }}
          api-key-id: ${{ vars.SIGNING_API_KEY_ID }}
          api-private-key: ${{ secrets.SIGNING_API_PRIVATE_KEY }}

      - name: Install macOS app provisioning profile
        id: macos_app_profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.swihomo.client
          profile-type: MAC_APP_STORE
          issuer-id: ${{ vars.SIGNING_API_ISSUER_ID }}
          api-key-id: ${{ vars.SIGNING_API_KEY_ID }}
          api-private-key: ${{ secrets.SIGNING_API_PRIVATE_KEY }}

      - name: Install macOS PacketTunnel provisioning profile
        id: macos_packet_tunnel_profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.swihomo.client.PacketTunnel
          profile-type: MAC_APP_STORE
          issuer-id: ${{ vars.SIGNING_API_ISSUER_ID }}
          api-key-id: ${{ vars.SIGNING_API_KEY_ID }}
          api-private-key: ${{ secrets.SIGNING_API_PRIVATE_KEY }}

      - name: Resolve provisioning profiles
        id: resolve_profiles
        shell: bash
        env:
          IOS_APP_PROFILES: ${{ steps.ios_app_profile.outputs.profiles }}
          IOS_PACKET_TUNNEL_PROFILES: ${{ steps.ios_packet_tunnel_profile.outputs.profiles }}
          MACOS_APP_PROFILES: ${{ steps.macos_app_profile.outputs.profiles }}
          MACOS_PACKET_TUNNEL_PROFILES: ${{ steps.macos_packet_tunnel_profile.outputs.profiles }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/swihomo-signing.keychain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          import subprocess
          import uuid
          from pathlib import Path

          PROFILE_DIRECTORY = Path(os.environ["HOME"]) / "Library" / "MobileDevice" / "Provisioning Profiles"
          UUID_PATTERN = re.compile(r"^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$")
          IDENTITY_PATTERN = re.compile(r'^\s*\d+\)\s+([0-9A-Fa-f]{40})\s+"([^"]+)"')
          specifications = (
              ("IOS_APP_PROFILES", "iOS app", "ios_app_profile", "iOS", "com.swihomo.client", "application-identifier"),
              ("IOS_PACKET_TUNNEL_PROFILES", "iOS PacketTunnel", "ios_packet_tunnel_profile", "iOS", "com.swihomo.client.PacketTunnel", "application-identifier"),
              ("MACOS_APP_PROFILES", "macOS app", "macos_app_profile", "OSX", "com.swihomo.client", "com.apple.application-identifier"),
              ("MACOS_PACKET_TUNNEL_PROFILES", "macOS PacketTunnel", "macos_packet_tunnel_profile", "OSX", "com.swihomo.client.PacketTunnel", "com.apple.application-identifier"),
          )

          def fail(message):
              raise SystemExit(f"Resolve provisioning profiles failed: {message}")

          def safe_scalar(value, field, label):
              if not isinstance(value, str) or not value.strip():
                  fail(f"{label} profile has an empty {field}")
              if any(ord(character) < 32 or ord(character) == 127 for character in value):
                  fail(f"{label} profile has an unsafe {field}")
              return value

          def canonical_uuid(value, label):
              if not isinstance(value, str) or not UUID_PATTERN.fullmatch(value):
                  fail(f"{label} profile has an invalid UUID")
              try:
                  return str(uuid.UUID(value)).upper()
              except ValueError:
                  fail(f"{label} profile has an invalid UUID")

          def profile_paths(profile_uuid, raw_uuid):
              spellings = []
              for spelling in (raw_uuid, profile_uuid, raw_uuid.upper(), raw_uuid.lower(), profile_uuid.lower()):
                  if spelling not in spellings:
                      spellings.append(spelling)
              paths = []
              for spelling in spellings:
                  for suffix in (".mobileprovision", ".provisionprofile"):
                      candidate = PROFILE_DIRECTORY / f"{spelling}{suffix}"
                      if candidate.is_file() and not any(os.path.samefile(candidate, existing) for existing in paths):
                          paths.append(candidate)
              return paths

          def decode_profile(path, label):
              try:
                  decoded = subprocess.run(
                      ["/usr/bin/security", "cms", "-D", "-i", str(path)],
                      shell=False,
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  ).stdout
              except (OSError, subprocess.CalledProcessError):
                  fail(f"{label} profile could not be decoded")
              try:
                  return plistlib.loads(decoded)
              except (plistlib.InvalidFileException, TypeError, ValueError):
                  fail(f"{label} profile decoded to invalid plist data")

          def validate_candidate(profile, profile_uuid, profile_name, label, expected_platform, expected_bundle_id, entitlement_key):
              decoded_uuid = profile.get("UUID")
              if not isinstance(decoded_uuid, str) or canonical_uuid(decoded_uuid, label) != profile_uuid:
                  fail(f"{label} profile UUID does not match action output")
              if profile.get("Name") != profile_name:
                  fail(f"{label} profile Name does not match action output")
              platforms = profile.get("Platform")
              if not isinstance(platforms, list) or expected_platform not in platforms:
                  fail(f"{label} profile does not target {expected_platform}")
              entitlements = profile.get("Entitlements")
              application_identifier = entitlements.get(entitlement_key) if isinstance(entitlements, dict) else None
              if not isinstance(application_identifier, str) or not application_identifier.endswith(f".{expected_bundle_id}"):
                  fail(f"{label} profile has an unexpected application identifier")
              certificates = profile.get("DeveloperCertificates")
              if not isinstance(certificates, list) or not certificates or not all(isinstance(certificate, bytes) and certificate for certificate in certificates):
                  fail(f"{label} profile has no valid DeveloperCertificates")
              return {hashlib.sha1(certificate).hexdigest().upper() for certificate in certificates}

          def find_apple_distribution_identities():
              try:
                  output = subprocess.run(
                      ["/usr/bin/security", "find-identity", "-v", "-p", "codesigning", os.environ["SIGNING_KEYCHAIN"]],
                      shell=False,
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  ).stdout.decode("utf-8", errors="replace")
              except (OSError, subprocess.CalledProcessError):
                  fail("could not enumerate Apple Distribution identities from the signing keychain")
              return {
                  match.group(1).upper()
                  for line in output.splitlines()
                  for match in [IDENTITY_PATTERN.match(line)]
                  if match and match.group(2).startswith("Apple Distribution:")
              }

          candidates_by_environment = {}
          for environment_name, label, output_prefix, expected_platform, expected_bundle_id, entitlement_key in specifications:
              raw_profiles = os.environ.get(environment_name)
              if raw_profiles is None or raw_profiles == "":
                  fail(f"{label} profile action returned no profiles output")
              try:
                  profiles = json.loads(raw_profiles)
              except json.JSONDecodeError as error:
                  fail(f"{label} profiles output is not valid JSON: {error.msg}")
              if not isinstance(profiles, list) or not profiles:
                  fail(f"{label} profiles output must be a non-empty JSON array")
              candidates = []
              for profile in profiles:
                  if not isinstance(profile, dict):
                      fail(f"{label} profiles output contains a non-object")
                  profile_name = safe_scalar(profile.get("name"), "name", label)
                  raw_uuid = safe_scalar(profile.get("udid"), "udid", label)
                  profile_uuid = canonical_uuid(raw_uuid, label)
                  paths = profile_paths(profile_uuid, raw_uuid)
                  if len(paths) == 0:
                      fail(f"{label} profile {profile_name} ({profile_uuid}) has no installed profile file")
                  if len(paths) > 1:
                      fail(f"{label} profile {profile_name} ({profile_uuid}) has multiple installed profile files")
                  decoded_profile = decode_profile(paths[0], label)
                  certificates = validate_candidate(
                      decoded_profile,
                      profile_uuid,
                      profile_name,
                      label,
                      expected_platform,
                      expected_bundle_id,
                      entitlement_key,
                  )
                  candidates.append({"name": profile_name, "uuid": profile_uuid, "certificates": certificates})
              candidates_by_environment[environment_name] = candidates

          apple_distribution = find_apple_distribution_identities()
          if not apple_distribution:
              fail("signing keychain has no Apple Distribution identity")

          def describe(candidates):
              return ", ".join(
                  f"{candidate['name']} ({candidate['uuid']}, {len(candidate['certificates'])} fingerprints)"
                  for candidate in candidates
              ) or "none"

          def select_solution(platform_label, app_environment, extension_environment):
              solutions = []
              for app_profile in candidates_by_environment[app_environment]:
                  for extension_profile in candidates_by_environment[extension_environment]:
                      common_fingerprints = app_profile["certificates"] & extension_profile["certificates"] & apple_distribution
                      for fingerprint in sorted(common_fingerprints):
                          solutions.append((app_profile, extension_profile, fingerprint))
              if len(solutions) != 1:
                  fail(
                      f"{platform_label} profile resolution requires exactly one joint solution, found {len(solutions)}; "
                      f"app candidates: {describe(candidates_by_environment[app_environment])}; "
                      f"PacketTunnel candidates: {describe(candidates_by_environment[extension_environment])}; "
                      f"Apple Distribution fingerprint count: {len(apple_distribution)}"
                  )
              return solutions[0]

          ios_app, ios_extension, _ = select_solution("iOS", "IOS_APP_PROFILES", "IOS_PACKET_TUNNEL_PROFILES")
          macos_app, macos_extension, _ = select_solution("macOS", "MACOS_APP_PROFILES", "MACOS_PACKET_TUNNEL_PROFILES")
          outputs = {
              "ios_app_profile_name": ios_app["name"],
              "ios_app_profile_uuid": ios_app["uuid"],
              "ios_packet_tunnel_profile_name": ios_extension["name"],
              "ios_packet_tunnel_profile_uuid": ios_extension["uuid"],
              "macos_app_profile_name": macos_app["name"],
              "macos_app_profile_uuid": macos_app["uuid"],
              "macos_packet_tunnel_profile_name": macos_extension["name"],
              "macos_packet_tunnel_profile_uuid": macos_extension["uuid"],
          }

          for key, value in outputs.items():
              safe_scalar(value, "output", key)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              fail("GITHUB_OUTPUT is unavailable")
          with open(output_path, "a", encoding="utf-8") as output_file:
              for key, value in outputs.items():
                  output_file.write(f"{key}={value}\n")
          PY

      - name: Read marketing version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          marketing_version="$(awk -F= '/^[[:space:]]*MARKETING_VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Config/Version.xcconfig)"

          [[ -n "$marketing_version" ]] || {
            printf '%s\n' 'MARKETING_VERSION is missing from Config/Version.xcconfig.' >&2
            exit 1
          }

          printf 'marketing-version=%s\n' "$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Archive and export signed packages
        shell: bash
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing-version }}
          IOS_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.ios_build_number }}
          MACOS_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.macos_build_number }}
          SWIHOMO_IOS_APP_PROFILE: ${{ steps.resolve_profiles.outputs.ios_app_profile_name }}
          SWIHOMO_IOS_PACKET_TUNNEL_PROFILE: ${{ steps.resolve_profiles.outputs.ios_packet_tunnel_profile_name }}
          SWIHOMO_MACOS_APP_PROFILE: ${{ steps.resolve_profiles.outputs.macos_app_profile_name }}
          SWIHOMO_MACOS_PACKET_TUNNEL_PROFILE: ${{ steps.resolve_profiles.outputs.macos_packet_tunnel_profile_name }}
          IOS_APP_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.ios_app_profile_uuid }}
          IOS_PACKET_TUNNEL_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.ios_packet_tunnel_profile_uuid }}
          MACOS_APP_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.macos_app_profile_uuid }}
          MACOS_PACKET_TUNNEL_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.macos_packet_tunnel_profile_uuid }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/swihomo-signing.keychain
        run: |
          set -euo pipefail

          ios_archive="$RUNNER_TEMP/Swihomo-iOS.xcarchive"
          macos_archive="$RUNNER_TEMP/Swihomo-macOS.xcarchive"
          ios_export="$RUNNER_TEMP/Swihomo-iOS-export"
          macos_export="$RUNNER_TEMP/Swihomo-macOS-export"
          ios_options="$RUNNER_TEMP/Swihomo-iOS-ExportOptions.plist"
          macos_options="$RUNNER_TEMP/Swihomo-macOS-ExportOptions.plist"

          rm -rf "$ios_archive" "$macos_archive" "$ios_export" "$macos_export" dist
          mkdir -p dist

          python3 - "$ios_options" "$macos_options" <<'PY'
          import os
          import plistlib
          import re
          import subprocess
          import sys

          ios_options, macos_options = sys.argv[1:]

          INSTALLER_IDENTITY_PATTERN = re.compile(
              r'^\s*\d+\)\s+([0-9A-Fa-f]{40})\s+"((?:Mac Installer Distribution|3rd Party Mac Developer Installer): .+ \(7P8CLHDH5G\))"$'
          )

          def macos_installer_identity():
              try:
                  result = subprocess.run(
                      ["/usr/bin/security", "find-identity", "-v", "-p", "basic", os.environ["SIGNING_KEYCHAIN"]],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
              except (KeyError, OSError, subprocess.CalledProcessError) as error:
                  raise SystemExit(f"Could not enumerate macOS installer signing identities: {error}")

              identities = [
                  (match.group(1).upper(), match.group(2))
                  for line in result.stdout.splitlines()
                  for match in [INSTALLER_IDENTITY_PATTERN.match(line)]
                  if match
              ]
              if len(identities) != 1:
                  names = ", ".join(name for _, name in identities) or "none"
                  raise SystemExit(
                      "Expected exactly one Mac Installer Distribution or legacy 3rd Party Mac Developer Installer "
                      f"identity for team 7P8CLHDH5G, found {len(identities)}: {names}"
                  )
              return identities[0][0]

          def write_plist(path, app_profile, packet_tunnel_profile, installer_signing_certificate=None):
              document = {
                  "method": "app-store",
                  "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
              }
              document.update(
                  {
                      "teamID": "7P8CLHDH5G",
                      "destination": "export",
                      "manageAppVersionAndBuildNumber": False,
                      "provisioningProfiles": {
                          "com.swihomo.client": app_profile,
                          "com.swihomo.client.PacketTunnel": packet_tunnel_profile,
                      },
                  }
              )
              if installer_signing_certificate is not None:
                  document["installerSigningCertificate"] = installer_signing_certificate
              with open(path, "wb") as plist_file:
                  plistlib.dump(document, plist_file, fmt=plistlib.FMT_XML, sort_keys=False)

          write_plist(
              ios_options,
              os.environ["SWIHOMO_IOS_APP_PROFILE"],
              os.environ["SWIHOMO_IOS_PACKET_TUNNEL_PROFILE"],
          )
          write_plist(
              macos_options,
              os.environ["SWIHOMO_MACOS_APP_PROFILE"],
              os.environ["SWIHOMO_MACOS_PACKET_TUNNEL_PROFILE"],
              macos_installer_identity(),
          )
          PY

          xcodebuild archive \
            -project Swihomo.xcodeproj \
            -scheme Swihomo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ios_archive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            DEVELOPMENT_TEAM=7P8CLHDH5G \
            MARKETING_VERSION="$MARKETING_VERSION" \
            SWIHOMO_IOS_APP_PROFILE="$SWIHOMO_IOS_APP_PROFILE" \
            SWIHOMO_IOS_PACKET_TUNNEL_PROFILE="$SWIHOMO_IOS_PACKET_TUNNEL_PROFILE" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"

          xcodebuild -exportArchive \
            -archivePath "$ios_archive" \
            -exportPath "$ios_export" \
            -exportOptionsPlist "$ios_options"

          xcodebuild archive \
            -project Swihomo.xcodeproj \
            -scheme Swihomo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$macos_archive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            DEVELOPMENT_TEAM=7P8CLHDH5G \
            MARKETING_VERSION="$MARKETING_VERSION" \
            SWIHOMO_MACOS_APP_PROFILE="$SWIHOMO_MACOS_APP_PROFILE" \
            SWIHOMO_MACOS_PACKET_TUNNEL_PROFILE="$SWIHOMO_MACOS_PACKET_TUNNEL_PROFILE" \
            CURRENT_PROJECT_VERSION="$MACOS_BUILD_NUMBER"

          xcodebuild -exportArchive \
            -archivePath "$macos_archive" \
            -exportPath "$macos_export" \
            -exportOptionsPlist "$macos_options"

          ios_packages=()
          while IFS= read -r package; do
            [[ -n "$package" ]] && ios_packages+=("$package")
          done < <(find "$ios_export" -type f -name '*.ipa' -print)
          [[ "${#ios_packages[@]}" -eq 1 ]] || {
            printf 'Expected exactly one iOS IPA, found %s.\n' "${#ios_packages[@]}" >&2
            exit 1
          }
          cp "${ios_packages[0]}" dist/Swihomo-iOS.ipa

          macos_packages=()
          while IFS= read -r package; do
            [[ -n "$package" ]] && macos_packages+=("$package")
          done < <(find "$macos_export" -type f -name '*.pkg' -print)
          [[ "${#macos_packages[@]}" -eq 1 ]] || {
            printf 'Expected exactly one macOS PKG, found %s.\n' "${#macos_packages[@]}" >&2
            exit 1
          }
          cp "${macos_packages[0]}" dist/Swihomo-macOS.pkg

      - name: Validate signatures and release metadata
        shell: bash
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing-version }}
          IOS_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.ios_build_number }}
          MACOS_BUILD_NUMBER: ${{ needs.allocate-build-number.outputs.macos_build_number }}
          IOS_APP_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.ios_app_profile_uuid }}
          IOS_PACKET_TUNNEL_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.ios_packet_tunnel_profile_uuid }}
          MACOS_APP_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.macos_app_profile_uuid }}
          MACOS_PACKET_TUNNEL_PROFILE_UUID: ${{ steps.resolve_profiles.outputs.macos_packet_tunnel_profile_uuid }}
        run: |
          set -euo pipefail

          ios_app="$RUNNER_TEMP/Swihomo-iOS.xcarchive/Products/Applications/Swihomo.app"
          ios_extension="$ios_app/PlugIns/PacketTunnel.appex"
          macos_app="$RUNNER_TEMP/Swihomo-macOS.xcarchive/Products/Applications/Swihomo.app"
          macos_extension="$macos_app/Contents/PlugIns/PacketTunnel.appex"

          codesign --verify --deep --strict "$ios_app"
          codesign --verify --deep --strict "$ios_extension"
          codesign --verify --deep --strict "$macos_app"
          codesign --verify --deep --strict "$macos_extension"
          pkgutil --check-signature dist/Swihomo-macOS.pkg

          python3 - "$ios_app" "$ios_extension" "$macos_app" "$macos_extension" <<'PY'
          import os
          import plistlib
          import subprocess
          import sys
          import uuid

          def fail(message):
              raise SystemExit(f"Archive signing material validation failed: {message}")

          def canonical_uuid(value, label):
              try:
                  return str(uuid.UUID(value)).upper()
              except ValueError:
                  fail(f"{label} has an invalid expected profile UUID")

          def decode_profile(path, label):
              if not os.path.isfile(path):
                  fail(f"{label} embedded profile is missing")
              try:
                  output = subprocess.run(
                      ["/usr/bin/security", "cms", "-D", "-i", path],
                      shell=False,
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  ).stdout
              except (OSError, subprocess.CalledProcessError):
                  fail(f"{label} embedded profile could not be decoded")
              try:
                  return plistlib.loads(output)
              except (plistlib.InvalidFileException, TypeError, ValueError):
                  fail(f"{label} embedded profile is invalid")

          ios_app, ios_extension, macos_app, macos_extension = sys.argv[1:]
          bundles = (
              ("iOS app", ios_app, "embedded.mobileprovision", os.environ["IOS_APP_PROFILE_UUID"]),
              ("iOS PacketTunnel", ios_extension, "embedded.mobileprovision", os.environ["IOS_PACKET_TUNNEL_PROFILE_UUID"]),
              ("macOS app", macos_app, os.path.join("Contents", "embedded.provisionprofile"), os.environ["MACOS_APP_PROFILE_UUID"]),
              ("macOS PacketTunnel", macos_extension, os.path.join("Contents", "embedded.provisionprofile"), os.environ["MACOS_PACKET_TUNNEL_PROFILE_UUID"]),
          )

          for label, bundle_path, embedded_name, expected_profile_uuid in bundles:
              profile = decode_profile(os.path.join(bundle_path, embedded_name), label)
              actual_profile_uuid = profile.get("UUID")
              if canonical_uuid(actual_profile_uuid, label) != canonical_uuid(expected_profile_uuid, label):
                  fail(f"{label} embedded profile UUID does not match the resolver output")
          PY

          assert_bundle_versions() {
            local label="$1"
            local plist_path="$2"
            local expected_build_number="$3"
            local actual_build_number
            local actual_marketing_version

            [[ -f "$plist_path" ]] || {
              printf 'Missing %s Info.plist at %s.\n' "$label" "$plist_path" >&2
              return 1
            }
            if ! actual_build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist_path")"; then
              printf 'Unable to read CFBundleVersion from %s Info.plist at %s.\n' "$label" "$plist_path" >&2
              return 1
            fi
            if ! actual_marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")"; then
              printf 'Unable to read CFBundleShortVersionString from %s Info.plist at %s.\n' "$label" "$plist_path" >&2
              return 1
            fi
            [[ "$actual_build_number" == "$expected_build_number" ]] || {
              printf '%s CFBundleVersion mismatch: expected %s, found %s.\n' "$label" "$expected_build_number" "$actual_build_number" >&2
              return 1
            }
            [[ "$actual_marketing_version" == "$MARKETING_VERSION" ]] || {
              printf '%s CFBundleShortVersionString mismatch: expected %s, found %s.\n' "$label" "$MARKETING_VERSION" "$actual_marketing_version" >&2
              return 1
            }
          }

          assert_bundle_versions 'iOS app' "$ios_app/Info.plist" "$IOS_BUILD_NUMBER"
          assert_bundle_versions 'iOS PacketTunnel' "$ios_extension/Info.plist" "$IOS_BUILD_NUMBER"
          assert_bundle_versions 'macOS app' "$macos_app/Contents/Info.plist" "$MACOS_BUILD_NUMBER"
          assert_bundle_versions 'macOS PacketTunnel' "$macos_extension/Contents/Info.plist" "$MACOS_BUILD_NUMBER"

          printf '{\n  "bundle_id": "com.swihomo.client",\n  "marketing_version": "%s",\n  "build_numbers": {"IOS": "%s", "MAC_OS": "%s"},\n  "platforms": ["IOS", "MAC_OS"]\n}\n' \
            "$MARKETING_VERSION" "$IOS_BUILD_NUMBER" "$MACOS_BUILD_NUMBER" > dist/release-metadata.json

      - name: Upload signed packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-packages
          path: |
            dist/Swihomo-iOS.ipa
            dist/Swihomo-macOS.pkg
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to App Store Connect
    needs: build
    runs-on: macos-latest
    environment: app-store-connect
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Download signed packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-packages
          path: dist

      - name: Prepare App Store Connect private key
        id: prepare-key
        shell: bash
        env:
          ASC_UPLOAD_API_PRIVATE_KEY: ${{ secrets.ASC_UPLOAD_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AppStoreConnectKey.p8"
          umask 077
          printf '%s' "$ASC_UPLOAD_API_PRIVATE_KEY" > "$key_path"
          [[ -s "$key_path" ]] || {
            printf '%s\n' 'ASC_UPLOAD_API_PRIVATE_KEY is empty.' >&2
            exit 1
          }
          printf 'key-path=%s\n' "$key_path" >> "$GITHUB_OUTPUT"

      - name: Validate App Store Connect settings
        shell: bash
        env:
          APPSTORE_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.APPSTORE_USES_NON_EXEMPT_ENCRYPTION }}
        run: |
          set -euo pipefail
          case "$APPSTORE_USES_NON_EXEMPT_ENCRYPTION" in
            true|false) ;;
            *)
              printf '%s\n' 'APPSTORE_USES_NON_EXEMPT_ENCRYPTION must be exactly true or false.' >&2
              exit 1
              ;;
          esac

      - name: Preflight TestFlight builds
        id: preflight
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ vars.ASC_UPLOAD_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_UPLOAD_API_KEY_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.prepare-key.outputs.key-path }}
          TESTFLIGHT_INTERNAL_GROUP_ID: ${{ secrets.TESTFLIGHT_INTERNAL_GROUP_ID }}
          BUNDLE_ID: com.swihomo.client
          MARKETING_VERSION: ${{ needs.build.outputs.marketing-version }}
          IOS_BUILD_NUMBER: ${{ needs.build.outputs.ios-build-number }}
          MACOS_BUILD_NUMBER: ${{ needs.build.outputs.macos-build-number }}
          RELEASE_METADATA_PATH: ${{ github.workspace }}/dist/release-metadata.json
        run: python3 scripts/manage_testflight_builds.py preflight

      - name: Upload iOS IPA to TestFlight
        if: steps.preflight.outputs.ios_upload == 'true'
        uses: Apple-Actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5
        with:
          app-path: dist/Swihomo-iOS.ipa
          app-type: ios
          backend: appstore-api
          wait-for-processing: 'true'
          uses-non-exempt-encryption: '${{ vars.APPSTORE_USES_NON_EXEMPT_ENCRYPTION }}'
          issuer-id: ${{ vars.ASC_UPLOAD_API_ISSUER_ID }}
          api-key-id: ${{ vars.ASC_UPLOAD_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_UPLOAD_API_PRIVATE_KEY }}

      - name: Upload macOS PKG to TestFlight
        if: steps.preflight.outputs.macos_upload == 'true'
        uses: Apple-Actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5
        with:
          app-path: dist/Swihomo-macOS.pkg
          app-type: macos
          backend: altool
          wait-for-processing: 'true'
          uses-non-exempt-encryption: '${{ vars.APPSTORE_USES_NON_EXEMPT_ENCRYPTION }}'
          issuer-id: ${{ vars.ASC_UPLOAD_API_ISSUER_ID }}
          api-key-id: ${{ vars.ASC_UPLOAD_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_UPLOAD_API_PRIVATE_KEY }}

      - name: Assign exact builds to internal TestFlight group
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ vars.ASC_UPLOAD_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_UPLOAD_API_KEY_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.prepare-key.outputs.key-path }}
          TESTFLIGHT_INTERNAL_GROUP_ID: ${{ secrets.TESTFLIGHT_INTERNAL_GROUP_ID }}
          BUNDLE_ID: com.swihomo.client
          MARKETING_VERSION: ${{ needs.build.outputs.marketing-version }}
          IOS_BUILD_NUMBER: ${{ needs.build.outputs.ios-build-number }}
          MACOS_BUILD_NUMBER: ${{ needs.build.outputs.macos-build-number }}
          RELEASE_METADATA_PATH: ${{ github.workspace }}/dist/release-metadata.json
        run: python3 scripts/manage_testflight_builds.py assign

      - name: Remove App Store Connect private key
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/AppStoreConnectKey.p8"
