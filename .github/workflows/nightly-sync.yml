name: Nightly Sync

on:
  workflow_dispatch:
  schedule:
    # Monday 06:00 CST / Sunday 22:00 UTC
    - cron: '0 22 * * 0'

permissions:
  {}

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward main from dev
    runs-on: ubuntu-latest
    steps:
      - name: Generate Swihomo Automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SWIHOMO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SWIHOMO_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            Swihomo
            swihomo-core
          permission-contents: write

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: dev
          fetch-depth: 0
          submodules: false

      - name: Sync mihomo core
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_TOKEN:-}" ]]; then
            printf '%s\n' 'GitHub App token is empty.' >&2
            exit 1
          fi
          github_app_basic_auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $github_app_basic_auth"
          git config --local user.name 'swihomo-automation[bot]'
          git config --local user.email '315911239+swihomo-automation[bot]@users.noreply.github.com'
          scripts/init-submodules.sh
          git -C Vendor/mihomo config --local user.name 'swihomo-automation[bot]'
          git -C Vendor/mihomo config --local user.email '315911239+swihomo-automation[bot]@users.noreply.github.com'
          # The script fetches its remote sources, rebases and pushes swihomo, saves
          # the sync base to the remote, and cleans up local scratch branches.
          scripts/rebase-mihomo.sh

      - name: Commit updated mihomo submodule reference
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Vendor/mihomo; then
            printf '%s\n' 'Mihomo submodule reference is already current; no dev push is needed.'
            exit 0
          fi
          git add Vendor/mihomo
          git commit -m 'chore(core): update mihomo submodule' -- Vendor/mihomo
          git push origin HEAD:refs/heads/dev

      - name: Fetch origin main and dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev

      - name: Verify fast-forward and update main
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/dev origin/main; then
            printf '%s\n' 'origin/dev is already an ancestor of origin/main; no push is needed.'
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/main origin/dev; then
            printf '::error::origin/main and origin/dev have diverged; refusing to merge, rebase, or force-push.\n'
            exit 1
          fi

          printf '%s\n' 'origin/main is behind origin/dev; fast-forwarding main.'
          git push origin origin/dev:refs/heads/main
